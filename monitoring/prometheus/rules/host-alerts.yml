groups:
  - name: runners-feed-host-alerts
    interval: 15s
    rules:
      - alert: NodeExporterDown
        expr: up{job="node-exporter"} == 0
        for: 1m
        labels:
          severity: critical
          service: node-exporter
        annotations:
          summary: Node Exporter is down
          description: Prometheus has not been able to scrape Node Exporter for more than 1 minute.

      - alert: CAdvisorDown
        expr: up{job="cadvisor"} == 0
        for: 1m
        labels:
          severity: critical
          service: cadvisor
        annotations:
          summary: cAdvisor is down
          description: Prometheus has not been able to scrape cAdvisor for more than 1 minute.

      - alert: HostCpuUsageHigh
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{job="node-exporter",mode="idle"}[5m])) * 100) >= 80
        for: 5m
        labels:
          severity: warning
          service: oci-vm
        annotations:
          summary: Host CPU usage is at least 80%
          description: CPU usage on {{ $labels.instance }} has remained at or above 80% for 5 minutes (current {{ $value | printf "%.1f" }}%).

      - alert: HostMemoryUsageHigh
        expr: 100 * (1 - (node_memory_MemAvailable_bytes{job="node-exporter"} / node_memory_MemTotal_bytes{job="node-exporter"})) >= 80
        for: 5m
        labels:
          severity: warning
          service: oci-vm
        annotations:
          summary: Host memory usage is at least 80%
          description: Memory usage on {{ $labels.instance }} has remained at or above 80% for 5 minutes (current {{ $value | printf "%.1f" }}%).

      - alert: HostDiskUsageWarning
        expr: |
          100 * (1 - (
            node_filesystem_avail_bytes{job="node-exporter",fstype!~"tmpfs|overlay|squashfs",mountpoint!~"/run($|/.*)"}
            /
            node_filesystem_size_bytes{job="node-exporter",fstype!~"tmpfs|overlay|squashfs",mountpoint!~"/run($|/.*)"}
          )) >= 80
          and
          100 * (1 - (
            node_filesystem_avail_bytes{job="node-exporter",fstype!~"tmpfs|overlay|squashfs",mountpoint!~"/run($|/.*)"}
            /
            node_filesystem_size_bytes{job="node-exporter",fstype!~"tmpfs|overlay|squashfs",mountpoint!~"/run($|/.*)"}
          )) < 90
        for: 5m
        labels:
          severity: warning
          service: oci-vm
        annotations:
          summary: Host disk usage is at least 80%
          description: Disk usage on {{ $labels.mountpoint }} has remained between 80% and 90% for 5 minutes (current {{ $value | printf "%.1f" }}%).

      - alert: HostDiskUsageCritical
        expr: |
          100 * (1 - (
            node_filesystem_avail_bytes{job="node-exporter",fstype!~"tmpfs|overlay|squashfs",mountpoint!~"/run($|/.*)"}
            /
            node_filesystem_size_bytes{job="node-exporter",fstype!~"tmpfs|overlay|squashfs",mountpoint!~"/run($|/.*)"}
          )) >= 90
        for: 5m
        labels:
          severity: critical
          service: oci-vm
        annotations:
          summary: Host disk usage is at least 90%
          description: Disk usage on {{ $labels.mountpoint }} has remained at or above 90% for 5 minutes (current {{ $value | printf "%.1f" }}%).

      - alert: ModelSuccessRateLow
        expr: runners_feed_model_completed_count >= 3 and runners_feed_model_success_rate < 0.95
        for: 5m
        labels:
          severity: critical
          service: runners-feed-model
        annotations:
          summary: Model success rate is below the rollback threshold
          description: Recent completed jobs have a success rate of {{ $value | printf "%.3f" }}.

      - alert: ModelFailureRateHigh
        expr: runners_feed_model_completed_count >= 3 and runners_feed_model_failure_rate > 0.10
        for: 5m
        labels:
          severity: critical
          service: runners-feed-model
        annotations:
          summary: Model failure rate is above the rollback threshold
          description: Recent failed jobs exceed the configured failure-rate guard.

      - alert: ModelInvalidResultDetected
        expr: runners_feed_model_invalid_result_count > 0
        for: 1m
        labels:
          severity: critical
          service: runners-feed-model
        annotations:
          summary: A successful job is missing its result artifact
          description: Result artifact validation detected an invalid successful job.

      - alert: ModelProcessingTooLong
        expr: runners_feed_model_stale_processing_count > 0
        for: 5m
        labels:
          severity: critical
          service: runners-feed-model
        annotations:
          summary: A model job exceeded the processing-time budget
          description: At least one queued or processing job exceeded the configured runtime guard.
