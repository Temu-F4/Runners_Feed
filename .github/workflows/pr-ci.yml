name: PR CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Install API dependencies
        run: python -m pip install -r api/requirements.txt
      - name: Run API unit tests
        env:
          PYTHONPATH: api
        run: python -m unittest discover -s api/tests -p 'test_*.py'

  worker-tests:
    name: Worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install worker test dependencies
        run: python -m pip install 'psycopg[binary]>=3.2,<4.0'
      - name: Run deterministic worker unit tests
        run: python -m unittest discover -s worker -p 'test_*.py'

  model-quality-gate:
    name: Model contract and quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate golden model fixture
        run: >-
          python coach/scripts/model_contract/quality_gate.py
          coach/tests/fixtures/model-golden
          coach/scripts/model_contract/quality_baseline.example.json
      - name: Validate model plugin manifest and Python syntax
        run: |
          python coach/scripts/model_contract/validate_plugin.py \
            coach/model_plugins/sehyeon-dcc2d7d
          python -m compileall -q \
            coach/model_plugins/sehyeon-dcc2d7d \
            coach/scripts/model_contract

  mobile-typecheck:
    name: Mobile Expo typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  compose-config:
    name: Compose config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Validate production Compose profile
        env:
          API_KEY: ci-placeholder
          POSTGRES_DB: runners_feed
          POSTGRES_USER: runners_feed
          POSTGRES_PASSWORD: ci-placeholder
          GRAFANA_ADMIN_PASSWORD: ci-placeholder
          GRAFANA_POSTGRES_PASSWORD: ci-placeholder
          RUNNERS_FEED_RUNTIME_DIR: ./runtime
          IMAGE_PREFIX: runners-feed
          IMAGE_TAG: ci
        run: >-
          docker compose
          -f compose.yaml
          -f compose.coach.yaml
          -f compose.backup.yaml
          --profile coach
          --profile backup
          config --quiet
      - name: Validate Alertmanager configuration
        run: >-
          docker run --rm
          --entrypoint /bin/amtool
          -v "$PWD/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"
          prom/alertmanager:v0.33.1
          check-config /etc/alertmanager/alertmanager.yml
      - name: Test deployment rollback behavior
        run: bash deploy/test_deploy_ghcr_release.sh
      - name: Test OCI coach-only architecture
        run: bash deploy/test_runpod_removal.sh
      - name: Test release verification behavior
        run: bash deploy/test_verify_release.sh
      - name: Test model quality watchdog behavior
        run: bash deploy/test_model_quality_watchdog.sh
      - name: Test database backup image selection
        run: bash deploy/test_database_backup_scripts.sh
