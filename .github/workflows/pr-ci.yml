name: PR CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Install API dependencies
        run: python -m pip install -r api/requirements.txt
      - name: Run API unit tests
        env:
          PYTHONPATH: api
        run: python -m unittest discover -s api/tests -p 'test_*.py'

  worker-tests:
    name: Worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install worker test dependencies
        run: python -m pip install 'psycopg[binary]>=3.2,<4.0'
      - name: Run deterministic worker unit tests
        working-directory: worker
        run: >-
          python -m unittest
          test_coach_report_adapter
          test_job_stages
          test_run_cleanup

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  compose-config:
    name: Compose config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Validate production Compose profile
        env:
          API_KEY: ci-placeholder
          POSTGRES_DB: runners_feed
          POSTGRES_USER: runners_feed
          POSTGRES_PASSWORD: ci-placeholder
          GRAFANA_ADMIN_PASSWORD: ci-placeholder
          GRAFANA_POSTGRES_PASSWORD: ci-placeholder
          RUNNERS_FEED_RUNTIME_DIR: ./runtime
          IMAGE_PREFIX: runners-feed
          IMAGE_TAG: ci
        run: >-
          docker compose
          -f compose.yaml
          -f compose.coach.yaml
          --profile coach
          config --quiet
      - name: Test deployment rollback behavior
        run: bash deploy/test_deploy_ghcr_release.sh
