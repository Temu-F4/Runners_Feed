services:
  inference-poc:
    profiles:
      - manual-poc
    build:
      context: ./worker
      dockerfile: Dockerfile.inference
      args:
        INFERENCE_UID: ${INFERENCE_UID:-1000}
        INFERENCE_GID: ${INFERENCE_GID:-1000}
    user: "${INFERENCE_UID:-1000}:${INFERENCE_GID:-1000}"
    environment:
      LLM_REPORT_ENABLED: ${LLM_REPORT_ENABLED:-false}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-https://ollama.com}
      OLLAMA_REPORT_MODEL: ${OLLAMA_REPORT_MODEL:-gemma4:31b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-90}
      VECTOR_RAG_ENABLED: ${VECTOR_RAG_ENABLED:-false}
      OLLAMA_EMBEDDING_BASE_URL: ${OLLAMA_EMBEDDING_BASE_URL:-http://ollama:11434}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-embeddinggemma}
    volumes:
      - ${RUNNERS_FEED_RUNTIME_DIR:-./runtime}/models:/workspace/models:ro
      - ${RUNNERS_FEED_RUNTIME_DIR:-./runtime}/run:/workspace/run
    networks:
      - backend
  inference-worker:
    profiles:
      - poc
    restart: unless-stopped
    build:
      context: ./worker
      dockerfile: Dockerfile.inference
      args:
        INFERENCE_UID: ${INFERENCE_UID:-1000}
        INFERENCE_GID: ${INFERENCE_GID:-1000}
    user: "${INFERENCE_UID:-1000}:${INFERENCE_GID:-1000}"
    entrypoint:
      - celery
      - -A
      - inference_celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=1
      - --queues=inference
    environment:
      OCI_CONFIG_FILE: /.oci/config
      OCI_CONFIG_PROFILE: DEFAULT
      OCI_REGION: ap-seoul-1
      OCI_RAW_BUCKET: bucket-t04-raw
      OCI_RESULTS_BUCKET: bucket-t04-results
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      INFERENCE_TIMEOUT_SECONDS: "3600"
      LLM_REPORT_ENABLED: ${LLM_REPORT_ENABLED:-false}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-https://ollama.com}
      OLLAMA_REPORT_MODEL: ${OLLAMA_REPORT_MODEL:-gemma4:31b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-90}
      VECTOR_RAG_ENABLED: ${VECTOR_RAG_ENABLED:-false}
      OLLAMA_EMBEDDING_BASE_URL: ${OLLAMA_EMBEDDING_BASE_URL:-http://ollama:11434}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-embeddinggemma}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    volumes:
      - /home/ubuntu/.oci:/.oci:ro
      - ${RUNNERS_FEED_RUNTIME_DIR:-./runtime}/models:/workspace/models:ro
      - ${RUNNERS_FEED_RUNTIME_DIR:-./runtime}/run:/workspace/run
    networks:
      - backend
  ollama:
    profiles:
      - poc
    image: ollama/ollama:0.11.10
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test:
        - CMD
        - ollama
        - list
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

volumes:
  ollama_data:
