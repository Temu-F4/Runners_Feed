services:
  inference-poc:
    profiles:
      - manual-poc
    build:
      context: ./worker
      dockerfile: Dockerfile.inference
    user: "${INFERENCE_UID:-1000}:${INFERENCE_GID:-1000}"
    volumes:
      - ${RUNNERS_FEED_RUNTIME_DIR:-./runtime}/models:/workspace/models:ro
      - ${RUNNERS_FEED_RUNTIME_DIR:-./runtime}/run:/workspace/run
    networks:
      - backend
  inference-worker:
    profiles:
      - poc
    build:
      context: ./worker
      dockerfile: Dockerfile.inference
    user: "${INFERENCE_UID:-1000}:${INFERENCE_GID:-1000}"
    entrypoint:
      - celery
      - -A
      - inference_celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=1
      - --queues=inference
    environment:
      OCI_CONFIG_FILE: /.oci/config
      OCI_CONFIG_PROFILE: DEFAULT
      OCI_REGION: ap-seoul-1
      OCI_RAW_BUCKET: bucket-t04-raw
      OCI_RESULTS_BUCKET: bucket-t04-results
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      INFERENCE_TIMEOUT_SECONDS: "3600"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /home/ubuntu/.oci:/.oci:ro
      - ${RUNNERS_FEED_RUNTIME_DIR:-./runtime}/models:/workspace/models:ro
      - ${RUNNERS_FEED_RUNTIME_DIR:-./runtime}/run:/workspace/run
    networks:
      - backend
